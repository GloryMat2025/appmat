name: Check Required Secrets

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  check-secrets:
    name: Validate required repository secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          missing=false
          for name in SUPABASE_SERVICE_ROLE_KEY VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "ERROR: Required secret '$name' is not set."
              missing=true
            fi
          done
          if [ "$missing" = true ]; then
            echo "One or more required secrets are missing. Failing check."
            exit 1
          fi
          echo "All required secrets are present."

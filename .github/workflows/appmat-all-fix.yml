name: appmat-all-fix

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Run ESLint autofix and collect report
        run: |
          pnpm exec eslint . --ext .js,.jsx,.ts,.tsx --fix || true
          pnpm exec eslint . --ext .js,.jsx,.ts,.tsx > eslint-report.txt || true

      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.txt

      - name: Run tests
        run: pnpm test

      - name: Save test results (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: ./test-results || ./logs || .

      - name: Install pnpm (fallback)
        run: npm install -g pnpm

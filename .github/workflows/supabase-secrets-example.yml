name: Supabase Secrets Example

on:
  workflow_dispatch:

jobs:
  verify-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Supabase & VAPID secrets are set
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; fi
          if [ -z "$VAPID_PUBLIC_KEY" ]; then echo "VAPID_PUBLIC_KEY is missing"; exit 1; fi
          if [ -z "$VAPID_PRIVATE_KEY" ]; then echo "VAPID_PRIVATE_KEY is missing"; exit 1; fi
          echo "Secrets appear present (not printed)."

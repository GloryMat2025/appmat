name: "Apply Claude Sonnet 4.5 patch" 
"on:"
"  workflow_dispatch:"
"    inputs:"
"      namespace:"
"        description: 'Kubernetes namespace to patch'" 
"        required: true"
"        default: 'my-namespace'"
"      deployment:"
"        description: 'Deployment name to patch'"
"        required: true"
"        default: 'my-api'"
"      patch_path:"
"        description: 'Path to json patch file relative to repo'" 
"        required: true"
"        default: 'deploy/k8s-patches/my-api-enable-claude-sonnet-4-5.patch.json'"
"jobs:"
"  apply_patch:"
"    runs-on: ubuntu-latest"
"    steps:"
"      - name: Checkout"
"        uses: actions/checkout@v4"
"      - name: Set kubeconfig from secret"
"        env:"
"          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}"
"        run: |"
"          mkdir -p $HOME/.kube"
"          echo \"$KUBECONFIG_CONTENT\" > $HOME/.kube/config"
"      - name: Show inputs and confirm"
"        run: |"
"          echo Deployment: ${{ github.event.inputs.deployment }}"
"          echo Namespace: ${{ github.event.inputs.namespace }}"
"          echo Patch path: ${{ github.event.inputs.patch_path }}"
"      - name: Apply k8s patch"
"        run: |"
"          kubectl patch deployment ${{ github.event.inputs.deployment }} -n ${{ github.event.inputs.namespace }} --type=json --patch-file=${{ github.event.inputs.patch_path }}"
"      - name: Verify rollout"
"        run: |"
"          kubectl rollout status deployment/${{ github.event.inputs.deployment }} -n ${{ github.event.inputs.namespace }}"
"          kubectl get pods -n ${{ github.event.inputs.namespace }} -l app=${{ github.event.inputs.deployment }} -o wide"

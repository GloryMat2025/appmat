name: Relay Smoke Test

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'supabase/tools/push-relay/**'
      - 'supabase/functions/notify-new-order/**'
      - '.github/workflows/relay-smoke.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'supabase/tools/push-relay/**'
      - 'supabase/functions/notify-new-order/**'
      - '.github/workflows/relay-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PORT: 4000
      RELAY_TOKEN: test-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start relay
        run: |
          node supabase/tools/push-relay/index.js &
          echo $! > relay.pid

      - name: Wait for relay to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4000/health > /dev/null; then
              echo "Relay is up"
              exit 0
            fi
            sleep 1
          done
          echo "Relay did not start in time" >&2
          exit 1

      - name: /api/notify should require token
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://localhost:4000/api/notify \
            -H "Content-Type: application/json" \
            -d '{"subscription":{"endpoint":"https://example"},"message":{"title":"Test"}}')
          if [ "$code" -ne 401 ]; then
            echo "Expected 401 without token, got $code" >&2
            exit 1
          fi

      - name: /api/notify with token succeeds (simulated)
        run: |
          curl -f -X POST http://localhost:4000/api/notify \
            -H "Content-Type: application/json" \
            -H "x-relay-token: $RELAY_TOKEN" \
            -d '{"subscription":{"endpoint":"https://example"},"message":{"title":"Test"}}'

      - name: /order-status returns ok
        run: |
          curl -f -X POST http://localhost:4000/order-status \
            -H "Content-Type: application/json" \
            -d '{"order_id":"abc123","status":"ready"}'

      - name: Stop relay
        if: always()
        run: |
          pkill -f "supabase/tools/push-relay/index.js" || true

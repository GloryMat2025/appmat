name: Promote Claude Sonnet 4.5 to Production

on:
  workflow_dispatch:

jobs:
  promote_prod:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://your-production-api.com
      # Requires manual approval on GitHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply prod patch
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_CONTENT" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl apply -f deploy/prod/prod-sonnet-45-patch.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/my-api -n production --timeout=240s

      - name: Slack - Production Success
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: good
          SLACK_MESSAGE: "Production deployed: Claude Sonnet 4.5 live for ALL clients! 🚀"
